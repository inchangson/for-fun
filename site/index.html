<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f3ed"><meta name="description" content="비밀번호로 보호된 비공개 자료입니다."><meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>비공개 자료</title><link rel="icon" href="data:,">
</head>
<body>
<a class="skip-link" href="#main">본문으로 바로가기</a>
<header class="site-header"><a class="brand" href="#/" aria-label="첫 페이지"><span class="brand-mark">↗</span><span id="brand-label">PRIVATE DOCUMENT</span></a><button id="privacy-toggle" role="switch" aria-checked="false">비공개 자료 <span id="toggle-state">OFF</span></button></header>
<nav id="navigation" aria-label="자료 목차" hidden></nav>
<main id="main" tabindex="-1"></main>
<footer><span>PRIVATE DOCUMENT</span><span>열람을 마치면 잠가 주세요.</span></footer>
<dialog id="unlock-dialog" aria-labelledby="unlock-title" aria-describedby="unlock-description">
<button id="dialog-close" class="dialog-close" aria-label="닫기">×</button><p class="eyebrow">PRIVATE ACCESS</p><h2 id="unlock-title">자료 열기</h2><p id="unlock-description">비밀번호를 입력해 자료를 확인하세요. 새로고침하거나 표시를 끄면 다시 잠깁니다.</p>
<form id="unlock-form"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="off" spellcheck="false" required><button id="unlock-submit" type="submit" class="primary">열기 ↗</button><p id="unlock-error" role="alert"></p></form></dialog>
<script type="module" src="/src/app.js"></script>
</body></html>
